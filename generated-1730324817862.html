
        <!DOCTYPE html>
        <html lang="en">
          <head>
            <meta charset="utf-8" />
            <title>The AR Business Card</title>
            <meta name="description" content="AR.js Business Card" />
            <script src="https://aframe.io/releases/0.8.0/aframe.min.js"></script>
            <script src="https://cdn.rawgit.com/jeromeetienne/AR.js/1.6.0/aframe/build/aframe-ar.js"></script>
          </head>
          <body style="margin: 0; overflow: hidden">
            <a-scene embedded arjs="trackingMethod: best; sourceType: webcam;">
              <a-plane rotation="-90 0 0" color="transparent" opacity="0" width="2" height="2">
                <a-image src="https://raw.githubusercontent.com/Boks-Boks/FileUpload/main/uploads/VISIT CARD(5).png" position="2.059 0.441 0" scale="2.2 3.5 2" width="2" height="1"></a-image>
              </a-plane>
              <a-plane position="0 0 0.8" color="transparent" opacity="0" width="3" height="1" rotation="-90 0 0">
                <a-plane src="https://raw.githubusercontent.com/Boks-Boks/FileUpload/main/uploads/paragliding-instructor-women(1).png" position="1.910 4.096 0.041" scale="1 1 1" depth="0.15" height="1.5" width="1.5"></a-plane>
                <a-plane src="https://raw.githubusercontent.com/Boks-Boks/FileUpload/main/uploads/VISIT CARD(3).png" position="-1.340 2.455 0" depth="0.15" height="1.5" width="1.5"></a-plane>
                <a-plane src="https://raw.githubusercontent.com/Boks-Boks/FileUpload/main/uploads/medal-first-place.png" position="-1.346 0.321 0" scale="1 1 1" depth="0.15" height="1.5" width="1.5"></a-plane>
                <a-plane src="https://raw.githubusercontent.com/Boks-Boks/FileUpload/main/uploads/Social-Media-Logo.jpg" position="2.079 -1.875 0" scale="0.700 2.1 1" depth="0.15" height="1" width="6" navigate-on-click="url: https://www.linkedin.com"></a-plane>
              </a-plane>
              <a-marker-camera type="pattern" url="https://raw.githubusercontent.com/Boks-Boks/FileUpload/main/uploads/custom-marker(8).patt"></a-marker-camera>
            </a-scene>
          </body>
        </html>
